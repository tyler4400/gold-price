<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="查看上金所基础金价 Au99.99、国际现货金参考价、八家品牌足金饰品报价及每日历史走势。"
    />
    <title>金价 · gold-price</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 在首屏绘制前应用主题；存储不可用时仍跟随系统。
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("gold-price-theme") || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            theme !== "dark" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <style>
      /* 外部 CSS 尚未下载时也使用正确背景，避免深色首屏白闪。 */
      html {
        background: #f5f1e8;
        color-scheme: light;
      }
      html.dark {
        background: #0d0c0b;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
