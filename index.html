<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="gold-price：公开金价走势与到价提醒，当前为界面脚手架预览。"
    />
    <title>金价 · gold-price</title>
    <script>
      // 在首屏绘制前应用主题；存储不可用时仍跟随系统。
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("gold-price-theme") || "system";
        } catch {}
        const dark =
          theme === "dark" ||
          (theme !== "light" &&
            theme !== "dark" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
