name = "gold-price"
main = "worker/index.ts"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

# 保留 workers.dev 与分支预览 URL；自定义域名写进配置，避免后续部署丢掉控制台绑定。
workers_dev = true
preview_urls = true

[[routes]]
pattern = "daily-gold.tyler4400.com"
custom_domain = true

# Workers Observability：日志与追踪全量采集（本站流量低）。
# 仅 [observability] enabled 只开日志；追踪需单独打开 traces.enabled。
# 说明见 https://developers.cloudflare.com/workers/observability/
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/healthz", "/api", "/api/*"]

# 生产 D1 已创建；database_id 是资源标识不是密钥。env.local 仍使用全零占位 ID。
[[d1_databases]]
binding = "DB"
database_name = "gold-price"
database_id = "752f61f4-2098-41c4-819e-eff502c4ceda"
migrations_dir = "migrations"

# D1 绑定不会继承到命名环境；本地使用独立、非远端的占位 ID。
[env.local]
name = "gold-price-local"

[[env.local.d1_databases]]
binding = "DB"
database_name = "gold-price-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.local.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/healthz", "/api", "/api/*"]

# 分支预览与生产共用 D1。D1 绑定不会自动继承到 [previews]，必须显式声明，否则预览构建会失败。
[[previews.d1_databases]]
binding = "DB"
database_name = "gold-price"
database_id = "752f61f4-2098-41c4-819e-eff502c4ceda"
migrations_dir = "migrations"

[previews.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/healthz", "/api", "/api/*"]

[previews.observability]
enabled = true
head_sampling_rate = 1

[previews.observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[previews.observability.traces]
enabled = true
head_sampling_rate = 1
