name = "gold-price"
main = "worker/index.ts"
compatibility_date = "2026-09-09"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/healthz", "/api", "/api/*"]

# 生产 D1 已创建；database_id 是资源标识不是密钥。env.local 仍使用全零占位 ID。
[[d1_databases]]
binding = "DB"
database_name = "gold-price"
database_id = "752f61f4-2098-41c4-819e-eff502c4ceda"
migrations_dir = "migrations"

# D1 绑定不会继承到命名环境；本地使用独立、非远端的占位 ID。
[env.local]
name = "gold-price-local"

[[env.local.d1_databases]]
binding = "DB"
database_name = "gold-price-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.local.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/healthz", "/api", "/api/*"]
