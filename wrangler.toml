name = "gold-price"
main = "worker/index.ts"
compatibility_date = "2026-09-09"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/healthz", "/api", "/api/*"]

# 阶段③创建数据库后填写；当前仅为部署配置占位，不能直接部署。
[[d1_databases]]
binding = "DB"
database_name = "gold-price"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# D1 绑定不会继承到命名环境；阶段①本地只运行静态资源和健康检查。
[env.local]
name = "gold-price-local"
d1_databases = []

[env.local.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/healthz", "/api", "/api/*"]
